<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Medvision Lab Store — Client Ordering Portal</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F5257" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Medvision brand palette */
    --navy-900:#081A2E;
    --navy-800:#0E2E4E;
    --blue-700:#204D74;   /* Bay of Many */
    --cerulean:#00AEEF;   /* brand accent */
    --orange:#F58220;     /* Ecstasy — reserved for price + CTA emphasis */

    --glass:rgba(255,255,255,0.07);
    --glass-strong:rgba(255,255,255,0.13);
    --glass-border:rgba(255,255,255,0.18);
    --glass-border-soft:rgba(255,255,255,0.10);

    --bg:var(--navy-900);
    --surface:var(--glass);
    --surface-2:var(--glass-strong);
    --border:var(--glass-border);
    --text:#F4F8FC;
    --text-muted:#9FB6CE;
    --success:#4ADE9C;
    --danger:#FF7A6E;
    --radius:16px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:
      radial-gradient(circle at 15% 0%, rgba(0,174,239,0.16), transparent 45%),
      radial-gradient(circle at 90% 20%, rgba(245,130,32,0.10), transparent 40%),
      linear-gradient(165deg, var(--navy-900) 0%, var(--navy-800) 55%, var(--blue-700) 130%);
    background-attachment:fixed;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px 32px;}

  /* Top bar */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:18px 0 14px;
    position:sticky;top:0;
    background:linear-gradient(to bottom, var(--navy-900) 60%, transparent);
    z-index:5;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg, var(--cerulean), var(--blue-700));
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;overflow:hidden;
    box-shadow:0 4px 14px rgba(0,174,239,0.35);
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;padding:3px;box-sizing:border-box;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-0.02em;color:#fff;}
  .topbar-spacer{flex:1;}

  /* Glass surface base, used by cards/tables/strips */
  .glass{
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 32px rgba(3,15,29,0.35);
  }

  /* Buttons */
  button{
    font-family:var(--font-body);
    border:none;border-radius:11px;
    cursor:pointer;
    font-size:14px;font-weight:500;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:linear-gradient(135deg, var(--cerulean), var(--blue-700));color:#fff;padding:12px 18px;box-shadow:0 6px 18px rgba(0,174,239,0.28);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{background:var(--glass-strong);color:var(--text);padding:12px 18px;border:1px solid var(--glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .btn-ghost{background:transparent;color:var(--text-muted);padding:8px 10px;}
  .btn-round{width:30px;height:30px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-border);font-size:16px;padding:0;line-height:1;color:var(--text);}
  .btn-round.filled{background:linear-gradient(135deg, var(--cerulean), var(--blue-700));color:#fff;border-color:transparent;}
  button:disabled{opacity:0.5;cursor:default;}

  input{
    font-family:var(--font-body);
    width:100%;padding:13px 14px;border-radius:11px;
    border:1px solid var(--glass-border);background:var(--glass);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    font-size:15px;color:var(--text);
  }
  input::placeholder{color:var(--text-muted);}
  input:focus{outline:none;border-color:var(--cerulean);box-shadow:0 0 0 3px rgba(0,174,239,0.18);}

  /* Login */
  .login-wrap{padding:14vh 0 0;}
  .login-card{text-align:center;margin-bottom:26px;}
  .login-flask{
    width:60px;height:60px;border-radius:18px;
    background:linear-gradient(135deg, var(--cerulean), var(--blue-700));
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,174,239,0.35);
  }
  .login-flask svg{width:30px;height:30px;}
  .login-flask img{width:100%;height:100%;object-fit:contain;padding:5px;box-sizing:border-box;}
  .login-title{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:-0.02em;color:#fff;}
  .login-sub{color:var(--text-muted);font-size:14px;margin:0;}
  .login-form{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
  .login-error{color:var(--danger);font-size:13px;text-align:center;margin:0;display:none;}
  .login-divider{display:flex;align-items:center;gap:10px;margin:6px 0;color:var(--text-muted);font-size:12px;}
  .login-divider::before,.login-divider::after{content:"";flex:1;height:1px;background:var(--glass-border);}
  .guest-badge{color:var(--text-muted) !important;background:var(--glass-strong) !important;border:1px solid var(--glass-border) !important;}

  .home-choices{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .home-choice{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 24px rgba(3,15,29,0.25);
    padding:18px 18px;cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .home-choice:active{background:var(--surface-2);}
  .home-choice:hover{border-color:rgba(0,174,239,0.4);}
  .home-choice-title{font-family:var(--font-display);font-weight:700;font-size:16px;color:#fff;margin:0 0 3px;}
  .home-choice-sub{font-size:12.5px;color:var(--text-muted);margin:0;}
  .guest-form{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;
  }
  .guest-form-title{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin:0 0 2px;}

  /* Breadcrumb */
  .crumbs{font-size:13px;color:var(--text-muted);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .crumbs span[data-crumb]{cursor:pointer;}
  .crumbs span[data-crumb]:hover{color:var(--teal-700);}
  .crumb-current{color:var(--text);font-weight:600;}
  .crumb-sep{opacity:0.4;}

  .client-strip{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 32px rgba(3,15,29,0.3);
    padding:13px 15px;margin-bottom:16px;
  }
  .client-strip .name{font-weight:600;font-size:14px;color:#fff;}
  .client-strip .discount{
    font-family:var(--font-mono);font-size:12px;color:var(--orange);
    background:rgba(245,130,32,0.16);padding:3px 8px;border-radius:6px;
    border:1px solid rgba(245,130,32,0.3);
  }

  .search-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
  .search-row input{flex:1;}

  /* Nav grid (departments/brands/categories) */
  .nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .nav-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 24px rgba(3,15,29,0.25);
    padding:22px 14px;text-align:center;cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .nav-card:active{background:var(--surface-2);border-color:rgba(0,174,239,0.4);}
  .nav-card .label{font-weight:600;font-size:14px;font-family:var(--font-display);color:#fff;}
  .nav-card .count{font-size:12px;color:var(--text-muted);margin-top:2px;}

  /* Product grid */
  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .product-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 24px rgba(3,15,29,0.25);
    overflow:hidden;
  }
  .product-card img{width:100%;height:104px;object-fit:cover;display:block;background:var(--surface-2);}
  .img-wrap{position:relative;}
  .product-card.out-of-stock{opacity:0.55;}
  .product-card.out-of-stock img{filter:grayscale(1);}
  .stock-badge{
    position:absolute;top:8px;left:8px;
    background:rgba(192,82,74,0.9);color:#fff;
    font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;
    padding:3px 8px;border-radius:6px;
  }
  .stock-note{font-size:11px;color:var(--orange);margin:6px 0 0;}
  .product-card.out-of-stock .stock-note{color:var(--text-muted);font-size:12px;margin:0;}
  button[data-inc]:disabled{opacity:0.35;}
  .product-body{padding:10px 11px 12px;}
  .product-name{font-size:13px;font-weight:600;margin:0 0 6px;line-height:1.3;min-height:34px;color:#fff;}
  .catalog-chip{
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.02em;
    color:var(--cerulean);border:1px dashed rgba(0,174,239,0.5);
    display:inline-block;padding:1px 6px;border-radius:5px;margin-bottom:7px;
    text-transform:uppercase;
  }
  .price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:9px;}
  .price-strike{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-decoration:line-through;}
  .price-final{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--orange);}
  .qty-row{display:flex;align-items:center;justify-content:space-between;}
  .qty-val{font-family:var(--font-mono);font-size:13px;min-width:14px;text-align:center;color:#fff;}

  /* Cart FAB */
  .cart-fab{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    max-width:488px;width:calc(100% - 32px);
    background:rgba(14,46,77,0.65);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(0,174,239,0.35);
    color:#fff;border-radius:16px;
    padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
    box-shadow:0 12px 32px rgba(0,0,0,0.4);
    cursor:pointer;z-index:6;
  }
  .cart-fab.hidden{display:none;}
  .cart-fab .left{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;}
  .cart-fab .badge{
    background:var(--orange);color:#fff;font-family:var(--font-mono);
    font-size:12px;font-weight:600;border-radius:20px;padding:2px 8px;
  }
  .cart-fab .total{font-family:var(--font-mono);font-weight:600;color:var(--orange);}

  /* Summary */
  .summary-header{margin-bottom:6px;}
  .summary-header .title{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;color:#fff;}
  .summary-header .sub{font-size:12px;color:var(--text-muted);margin:3px 0 0;}
  .order-table{
    width:100%;border-collapse:collapse;font-size:12.5px;margin:16px 0 14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    overflow:hidden;
  }
  .order-table th{text-align:left;font-weight:600;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;padding:12px 10px 8px;border-bottom:1px solid var(--border);}
  .order-table td{padding:10px;border-bottom:1px solid var(--glass-border-soft);vertical-align:top;color:var(--text);}
  .order-table .num{font-family:var(--font-mono);text-align:right;}
  .grand-total-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;margin-bottom:18px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  }
  .grand-total-row .label{color:var(--text-muted);font-size:13px;}
  .grand-total-row .value{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--orange);}
  .summary-actions{display:flex;gap:10px;}
  .summary-actions button{flex:1;}
  .status-msg{font-size:13px;margin-top:12px;text-align:center;display:none;}
  .status-msg.success{color:var(--success);}
  .status-msg.error{color:var(--danger);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;}
  .loading-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;}

  /* Image lightbox */
  .img-modal-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(3,10,20,0.9);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    cursor:zoom-out;
  }
  .img-modal-img{
    max-width:100%;max-height:85vh;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    cursor:default;
  }
  .img-modal-close{
    position:absolute;top:18px;right:18px;
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);
    color:#fff;font-size:16px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
