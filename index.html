<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LabStore — Client Ordering Portal</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F5257" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --teal-900:#0A3B3F;
    --teal-700:#0F5257;
    --teal-600:#156B70;
    --amber-500:#D9A441;
    --amber-600:#C08F2F;
    --bg:#F7F9F9;
    --surface:#FFFFFF;
    --surface-2:#F0F4F3;
    --border:#E1E7E6;
    --text:#16302E;
    --text-muted:#657875;
    --success:#3F8C6E;
    --danger:#C0524A;
    --radius:14px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px 32px;}

  /* Top bar */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:18px 0 14px;
    position:sticky;top:0;background:var(--bg);z-index:5;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--teal-700);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-0.02em;}
  .topbar-spacer{flex:1;}

  /* Buttons */
  button{
    font-family:var(--font-body);
    border:none;border-radius:10px;
    cursor:pointer;
    font-size:14px;font-weight:500;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal-700);color:#fff;padding:12px 18px;}
  .btn-primary:hover{background:var(--teal-600);}
  .btn-secondary{background:var(--surface-2);color:var(--text);padding:12px 18px;border:1px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--text-muted);padding:8px 10px;}
  .btn-round{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);font-size:16px;padding:0;line-height:1;color:var(--text);}
  .btn-round.filled{background:var(--teal-700);color:#fff;border-color:var(--teal-700);}
  button:disabled{opacity:0.5;cursor:default;}

  input{
    font-family:var(--font-body);
    width:100%;padding:13px 14px;border-radius:10px;
    border:1px solid var(--border);background:var(--surface);
    font-size:15px;color:var(--text);
  }
  input:focus{outline:none;border-color:var(--teal-600);box-shadow:0 0 0 3px rgba(21,107,112,0.12);}

  /* Login */
  .login-wrap{padding:14vh 0 0;}
  .login-card{text-align:center;margin-bottom:26px;}
  .login-flask{
    width:56px;height:56px;border-radius:16px;background:var(--teal-700);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  }
  .login-flask svg{width:28px;height:28px;}
  .login-title{font-family:var(--font-display);font-weight:700;font-size:24px;margin:0 0 4px;letter-spacing:-0.02em;}
  .login-sub{color:var(--text-muted);font-size:14px;margin:0;}
  .login-form{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
  .login-error{color:var(--danger);font-size:13px;text-align:center;margin:0;display:none;}

  /* Breadcrumb */
  .crumbs{font-size:13px;color:var(--text-muted);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .crumbs span[data-crumb]{cursor:pointer;}
  .crumbs span[data-crumb]:hover{color:var(--teal-700);}
  .crumb-current{color:var(--text);font-weight:600;}
  .crumb-sep{opacity:0.4;}

  .client-strip{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:16px;
  }
  .client-strip .name{font-weight:600;font-size:14px;}
  .client-strip .discount{
    font-family:var(--font-mono);font-size:12px;color:var(--amber-600);
    background:rgba(217,164,65,0.15);padding:3px 8px;border-radius:6px;
  }

  /* Nav grid (departments/brands/categories) */
  .nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .nav-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 14px;text-align:center;cursor:pointer;
  }
  .nav-card:active{background:var(--surface-2);}
  .nav-card .label{font-weight:600;font-size:14px;font-family:var(--font-display);}
  .nav-card .count{font-size:12px;color:var(--text-muted);margin-top:2px;}

  /* Product grid */
  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .product-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;
  }
  .product-card img{width:100%;height:104px;object-fit:cover;display:block;background:var(--surface-2);}
  .product-body{padding:10px 11px 12px;}
  .product-name{font-size:13px;font-weight:600;margin:0 0 6px;line-height:1.3;min-height:34px;}
  .catalog-chip{
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.02em;
    color:var(--teal-700);border:1px dashed var(--teal-600);
    display:inline-block;padding:1px 6px;border-radius:5px;margin-bottom:7px;
    text-transform:uppercase;
  }
  .price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:9px;}
  .price-strike{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-decoration:line-through;}
  .price-final{font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--teal-700);}
  .qty-row{display:flex;align-items:center;justify-content:space-between;}
  .qty-val{font-family:var(--font-mono);font-size:13px;min-width:14px;text-align:center;}

  /* Cart FAB */
  .cart-fab{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    max-width:488px;width:calc(100% - 32px);
    background:var(--teal-700);color:#fff;border-radius:14px;
    padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
    box-shadow:0 8px 24px rgba(10,59,63,0.28);
    cursor:pointer;z-index:6;
  }
  .cart-fab.hidden{display:none;}
  .cart-fab .left{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;}
  .cart-fab .badge{
    background:var(--amber-500);color:var(--teal-900);font-family:var(--font-mono);
    font-size:12px;font-weight:600;border-radius:20px;padding:2px 8px;
  }
  .cart-fab .total{font-family:var(--font-mono);font-weight:600;}

  /* Summary */
  .summary-header{margin-bottom:6px;}
  .summary-header .title{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0;}
  .summary-header .sub{font-size:12px;color:var(--text-muted);margin:3px 0 0;}
  .order-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:16px 0 14px;}
  .order-table th{text-align:left;font-weight:600;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;padding:0 6px 8px;border-bottom:1px solid var(--border);}
  .order-table td{padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:top;}
  .order-table .num{font-family:var(--font-mono);text-align:right;}
  .grand-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-bottom:18px;}
  .grand-total-row .label{color:var(--text-muted);font-size:13px;}
  .grand-total-row .value{font-family:var(--font-mono);font-size:20px;font-weight:600;}
  .summary-actions{display:flex;gap:10px;}
  .summary-actions button{flex:1;}
  .status-msg{font-size:13px;margin-top:12px;text-align:center;display:none;}
  .status-msg.success{color:var(--success);}
  .status-msg.error{color:var(--danger);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;}
  .loading-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
